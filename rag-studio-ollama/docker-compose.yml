  services:
    nginx-proxy:
      image: nginx:alpine
      container_name: rag-nginx
      ports:
        - "80:80"
      volumes:
        - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
        - ./frontend/dist:/usr/share/nginx/html
      depends_on:
        - backend
      networks:
        - rag-network

    ollama:
      image: ollama/ollama:latest
      container_name: ollama
      volumes:
        - ollama_models:/root/.ollama
      environment:
        - OLLAMA_HOST=0.0.0.0
      networks:
        - rag-network

    qdrant:
      image: qdrant/qdrant:latest
      container_name: qdrant
      ports:
        - "6333:6333"
        - "6334:6334"
      volumes:
        - qdrant_data:/qdrant/storage
      networks:
        - rag-network
      restart: unless-stopped

    db:
      image: postgres:15
      container_name: postgres_db
      environment:
        POSTGRES_DB: rag_studio
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - rag-network

    backend:
      build: ./backend
      container_name: rag-backend
      depends_on:
        - ollama
        - qdrant
        - db
      volumes:
        - ./data/uploaded_files:/app/data/uploaded_files
      environment:
        - OLLAMA_BASE_URL=http://ollama:11434
        - DEFAULT_MODEL=llama3:8b
        - DATABASE_URL=postgresql://postgres:password@db:5432/rag_studio
        - QDRANT_HOST=qdrant
        - QDRANT_PORT=6333
        # Переменные для инициализации администратора
        - ADMIN_USERNAME=admin
        - ADMIN_EMAIL=admin@localhost.local
        - ADMIN_PASSWORD=admin123
      networks:
        - rag-network
      command: >
        sh -c "
          echo 'Waiting for Ollama...'
          while ! curl -f http://ollama:11434/api/tags >/dev/null 2>&1; do
            sleep 2
          done
          echo 'Ollama is ready!'
          echo 'Waiting for Qdrant...'
          while ! nc -z qdrant 6333; do
            sleep 2
          done
          echo 'Qdrant is ready!'
          echo 'Waiting for PostgreSQL...'
          while ! nc -z db 5432; do
            sleep 2
          done
          echo 'PostgreSQL is ready! Starting backend...'
          python init_admin.py
          uvicorn main:app --host 0.0.0.0 --port 8000
        "

  volumes:
    ollama_models:
    postgres_data:
    qdrant_data:

  networks:
    rag-network:
      driver: bridge    